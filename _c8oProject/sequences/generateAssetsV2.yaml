      '// The folders scripts, assets and svg of a PWA are links to those of the template. Linux and macOS create them
      // here, without a shell; Windows makes junctions with mklink (a symbolic link needs a privilege there).
      var linkNames = ["scripts", "assets", "svg"];
      var cmdLinkScripts = null, cmdLinkAssets = null, cmdLinkSvg = null;
      if(isWindows){
      	cmdLinkScripts = ''cmd /C mklink /J "'' + pwaPath + target + separator + ''scripts" "'' + projectPath + separator + ''DisplayObjects'' + separator + ''template-pwa'' + separator + ''scripts"'';
          cmdLinkAssets = ''cmd /C mklink /J "'' + pwaPath + target + separator + ''assets" "'' + projectPath + separator + ''DisplayObjects'' + separator + ''template-pwa'' + separator + ''assets"'';
          cmdLinkSvg = ''cmd /C mklink /J "'' + pwaPath + target + separator + ''svg" "'' + projectPath + separator + ''DisplayObjects'' + separator + ''template-pwa'' + separator + ''svg"'';
      }
      else{
      	var LinkOption = java.nio.file.LinkOption;
      	for (var l = 0; l < linkNames.length; l++) {
      		var link = java.nio.file.Paths.get(pwaPath + target + separator + linkNames[l]);
      		var source = java.nio.file.Paths.get(projectPath + separator + "DisplayObjects" + separator + "template-pwa" + separator + linkNames[l]);
      		// as ln -sfn: an existing link is replaced, a real folder is left alone
      		if (java.nio.file.Files.isSymbolicLink(link)) {
      			java.nio.file.Files.delete(link);
      		}
      		if (!java.nio.file.Files.exists(link, LinkOption.NOFOLLOW_LINKS)) {
      			java.nio.file.Files.createSymbolicLink(link, source);
      		}
      	}
      }
      log.debug("generateAssetsV2] createSymlinkInPWAS links of " + target + (isWindows ? " made by mklink" : " made"));'
