↓RewriteNgswJson [steps.SimpleStep-1729758157997]: 
  comment: the ngsw.json of the template, with the paths and the hashes of this PWA
  expression: |
    '// The ngsw.json of the template is written for the PWA in one pass, in the engine: its paths under
    // DisplayObjects/mobile/ point to the folder of the PWA, and the hashes of index.html and manifest.webmanifest are
    // those of the files of the PWA, which differ from the template (title, icon, manifest). This was three sed (or
    // powershell, whose .replace() is literal and left the hashes of the template) processes per PWA.
    var MessageDigest = java.security.MessageDigest;
    var Files = java.nio.file.Files;
    var Paths = java.nio.file.Paths;
    var Matcher = java.util.regex.Matcher;
    var charset = java.nio.charset.StandardCharsets.UTF_8;
    var sha1 = function (filePath) {
        var hashBytes = MessageDigest.getInstance("SHA-1").digest(Files.readAllBytes(Paths.get(filePath)));
        var hex = new java.lang.StringBuilder();
        for (var i = 0; i < hashBytes.length; i++) {
            hex.append(java.lang.String.format("%02x", new java.lang.Byte(hashBytes[i])));
        }
        return "" + hex.toString();
    };
    var sha1HashIndexHtml = sha1(pwaPath + target + separator + "index.html");
    var sha1Manifest = sha1(pwaPath + target + separator + "manifest.webmanifest");
    var ngsw = new java.lang.String(Files.readAllBytes(Paths.get(projectPath + separator + "DisplayObjects" + separator + "template-pwa" + separator + "ngsw.json")), charset);
    // as sed s#DisplayObjects/mobile/#DisplayObjects/pwas/<target>/#g, then s/index\.html": "[a-f0-9]{40}"/.../g
    ngsw = ngsw.replace("DisplayObjects/mobile/", "DisplayObjects/pwas/" + target + "/");
    ngsw = ngsw.replaceAll("index\\.html\": \"[a-f0-9]{40}\"", Matcher.quoteReplacement("index.html\": \"" + sha1HashIndexHtml + "\""));
    ngsw = ngsw.replaceAll("manifest\\.webmanifest\": \"[a-f0-9]{40}\"", Matcher.quoteReplacement("manifest.webmanifest\": \"" + sha1Manifest + "\""));
    Files.write(Paths.get(pwaPath + target + separator + "ngsw.json"), ngsw.getBytes(charset));
    log.debug("generateAssetsV2] RewriteNgswJson ngsw.json of " + target + " written, index.html " + sha1HashIndexHtml + ", manifest " + sha1Manifest);'
